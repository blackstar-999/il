name: Build BlackStaR APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;21.4.7075529"

      - name: Create API_KEYS
        run: |
          cat > API_KEYS << EOF
          APP_ID = ${{ secrets.APP_ID }}
          APP_HASH = "${{ secrets.APP_HASH }}"
          MAPS_V2_API = ${{ secrets.MAPS_KEY }}
          
          SIGNING_KEY_PASSWORD = ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS = ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_STORE_PASSWORD = ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          EOF

      - name: Build APK
        run: ./gradlew assembleAfatRelease --no-daemon

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find TMessagesProj/build/outputs/apk/afat/release -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_NAME=$(basename "$APK_PATH")
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: BlackStaR v1.0.0
          body: |
            🌟 BlackStaR v1.0.0 Release
            - Telegram client with ghost mode
            - Deleted messages history
            - Customizable features
          files: ${{ steps.find-apk.outputs.apk_path }}
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
